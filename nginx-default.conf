server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    client_max_body_size 6G;
    # Increase header buffer size
    large_client_header_buffers 4 32k;
    # Increase the maximum allowed size of the client request body
    client_body_buffer_size 32k;
    # Increase the maximum allowed size of the client request header fields
    client_header_buffer_size 32k;
    # Collab server (WebSocket)
    location /collab {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    # NextJS Revalidation
    location /api/revalidate {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Next Auth
    location /api/auth {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Python Backend API
    location /api/v1 {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts to allow large uploads (e.g. SCORM packages up to 5GB)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Backend Static Content
    location /content {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # FastAPI Docs (only available in development mode)
    location /api/v1/docs {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # FastAPI ReDoc (only available in development mode)
    location /api/v1/redoc {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # In single-tenancy mode there's exactly one organization. The app's own
    # multi-org hub at /home (org picker + "Create organization") still exists
    # in the OSS build and isn't gated by tenancy, so send it straight to /
    # instead, which the app's tenancy-aware middleware resolves directly into
    # the one configured org.
    location = /home {
        return 302 /;
    }

    # Static legal pages. The app's own Terms/Privacy links only work once
    # NEXT_PUBLIC_LEARNHOUSE_PLATFORM_URL points here (see env vars) — see
    # legal/*.html for source.
    location = /terms {
        alias /usr/share/nginx/html/terms.html;
    }
    location = /privacy {
        alias /usr/share/nginx/html/privacy.html;
    }
    location = /contact {
        alias /usr/share/nginx/html/contact.html;
    }

    # Frontend
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
